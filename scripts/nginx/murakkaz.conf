# Storefront & Admin via Direct IP / Main Domain
server {
    server_name murakkaz.com www.murakkaz.com 103.174.51.34;

    client_max_body_size 50M;

    # Admin Dashboard via Direct IP (/admin)
    location /admin {
        alias /var/www/murakkaz/Admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Static images directly from App/public/images/
    location /images/ {
        alias /var/www/murakkaz/App/public/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/murakkaz/Backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Next.js Static Assets (Aggressive immutable caching served directly from disk)
    location /_next/static/ {
        alias /var/www/murakkaz/App/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Storefront Next.js App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent browsers from caching stale HTML so chunk hashes are always fresh
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Express Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/murakkaz.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/murakkaz.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Admin Subdomain (admin.murakkaz.com)
server {
    server_name admin.murakkaz.com;

    root /var/www/murakkaz/Admin/dist;
    index index.html;

    client_max_body_size 50M;

    # Static images directly from App/public/images/
    location /images/ {
        alias /var/www/murakkaz/App/public/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/murakkaz/Backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/murakkaz.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/murakkaz.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Standalone API Subdomain (api.murakkaz.com)
server {
    server_name api.murakkaz.com;

    client_max_body_size 50M;

    # Static images directly from App/public/images/
    location /images/ {
        alias /var/www/murakkaz/App/public/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/murakkaz/Backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/murakkaz.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/murakkaz.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.murakkaz.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = murakkaz.com) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name murakkaz.com www.murakkaz.com 103.174.51.34;
    return 404;
}

server {
    if ($host = admin.murakkaz.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name admin.murakkaz.com;
    return 404;
}

server {
    if ($host = api.murakkaz.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name api.murakkaz.com;
    return 404;
}
